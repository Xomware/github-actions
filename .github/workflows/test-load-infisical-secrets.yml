name: Test load-infisical-secrets

on:
  pull_request:
    paths:
      - actions/load-infisical-secrets/**
      - .github/workflows/test-load-infisical-secrets.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/load-infisical-secrets
        with:
          path: /xomify
      - name: Assert a known secret loaded
        run: |
          case "$AWS_FRONTEND_ROLE_ARN" in
            arn:aws:iam::*:role/xomify-github-actions-frontend) echo "loaded" ;;
            *) echo "::error::AWS_FRONTEND_ROLE_ARN missing or wrong"; exit 1 ;;
          esac
