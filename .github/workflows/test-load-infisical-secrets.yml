name: Test load-infisical-secrets

on:
  pull_request:
    paths:
      - actions/load-infisical-secrets/**
      - .github/workflows/test-load-infisical-secrets.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/load-infisical-secrets
        with:
          path: /xomify
          tf-vars: 'true'
      - name: Assert a known secret loaded
        run: |
          case "$AWS_FRONTEND_ROLE_ARN" in
            arn:aws:iam::*:role/xomify-github-actions-frontend) echo "loaded" ;;
            *) echo "::error::AWS_FRONTEND_ROLE_ARN missing or wrong"; exit 1 ;;
          esac
          [ "$TF_VAR_aws_frontend_role_arn" = "$AWS_FRONTEND_ROLE_ARN" ] || { echo "::error::TF_VAR_ export missing"; exit 1; }
          # The multi-line APNS key must survive the GITHUB_ENV heredoc intact.
          [ "$TF_VAR_apns_signing_key_p8" = "$APNS_SIGNING_KEY_P8" ] || { echo "::error::multi-line TF_VAR_ mangled"; exit 1; }
