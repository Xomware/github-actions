# Plan on every run, comment the plan on PRs, apply the saved plan on the default branch.
# Secrets come from Infisical folder /<app>: each one is exported as TF_VAR_<lowercased name>,
# and AWS_TERRAFORM_PLAN_ROLE_ARN / AWS_TERRAFORM_APPLY_ROLE_ARN pick the AWS role.
#
# Caller must grant: contents: read, pull-requests: write, id-token: write.
name: Terraform

on:
  workflow_call:
    inputs:
      app:
        description: Infisical folder holding this app's secrets and role ARNs, e.g. `xomify`.
        required: true
        type: string
      working-directory:
        default: terraform
        type: string
      terraform-version:
        default: 1.5.7
        type: string
      aws-region:
        default: us-east-1
        type: string

jobs:
  terraform:
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-${{ github.repository }}
      cancel-in-progress: false
    env:
      # Pushes and manual runs on the default branch apply. Everything else, PRs included,
      # only ever gets the read-only plan role.
      APPLY: ${{ github.ref_name == github.event.repository.default_branch && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Xomware/github-actions/actions/load-infisical-secrets@v1
        with:
          path: /${{ inputs.app }}
          tf-vars: 'true'

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.APPLY == 'true' && env.AWS_TERRAFORM_APPLY_ROLE_ARN || env.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - run: terraform init -input=false
      - run: terraform validate

      # Saved so apply runs exactly what was planned; a state change in between makes apply
      # refuse the stale plan instead of applying something nobody saw.
      - name: Plan
        id: plan
        continue-on-error: true
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -lock=false -out=tfplan 2>&1 | tee "$RUNNER_TEMP/plan.txt"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_FILE: ${{ runner.temp }}/plan.txt
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... truncated';
            const marker = '<!-- terraform-plan -->';
            const body = `${marker}\n### Terraform plan: ${process.env.OUTCOME}\n<details><summary>Plan output</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail on plan error
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Apply
        if: env.APPLY == 'true'
        run: terraform apply -input=false tfplan
