# Build a static frontend and publish it to S3 behind CloudFront.
# Before `build-command` runs, the env holds every secret in Infisical folder /<app> plus each
# `ssm` entry, so the build (or a sed in front of it) can bake them in. HTML is uploaded
# no-cache and every other file is cached for a year, so filenames must be content-hashed.
# `nextjs: true` handles a static export instead: see the Upload step.
#
# Caller must grant: contents: read, id-token: write.
name: Deploy frontend

on:
  workflow_call:
    inputs:
      app:
        description: Infisical folder, e.g. `xomware`.
        required: true
        type: string
      role-key:
        description: Infisical secret holding the deploy role ARN.
        default: AWS_FRONTEND_ROLE_ARN
        type: string
      node-version:
        default: '20'
        type: string
      root:
        description: Directory holding package.json.
        default: .
        type: string
      install-command:
        default: npm ci
        type: string
      build-command:
        required: true
        type: string
      ssm:
        description: >-
          Terraform-computed values to export before the build, one `NAME=/ssm/path` per line.
          A missing or empty parameter fails the deploy.
        default: ''
        type: string
      dist-dir:
        description: Build output, relative to `root`.
        required: true
        type: string
      bucket:
        required: true
        type: string
      domain:
        description: A CloudFront alias of the distribution to invalidate.
        required: true
        type: string
      nextjs:
        description: The output is a Next.js static export.
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-frontend-${{ inputs.bucket }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Xomware/github-actions/actions/load-infisical-secrets@v1
        with:
          path: /${{ inputs.app }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env[inputs.role-key] }}
          aws-region: us-east-1

      # An `echo "X=$(aws ...)"` that swallowed a failed fetch once shipped empty credentials
      # to prod (xomify #296), so every value is checked.
      - name: Load SSM values
        if: inputs.ssm != ''
        env:
          SSM: ${{ inputs.ssm }}
        run: |
          set -euo pipefail
          while IFS='=' read -r name path; do
            [ -z "$name" ] && continue
            value=$(aws ssm get-parameter --name "$path" --with-decryption --query Parameter.Value --output text)
            if [ -z "$value" ] || [ "$value" = None ]; then
              echo "::error::SSM $path is empty"
              exit 1
            fi
            echo "$name=$value" >> "$GITHUB_ENV"
          done <<< "$SSM"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.root }}/package-lock.json

      - run: ${{ inputs.install-command }}
      - run: ${{ inputs.build-command }}

      - name: Upload
        env:
          DIST: ${{ inputs.dist-dir }}
          BUCKET: ${{ inputs.bucket }}
          NEXTJS: ${{ inputs.nextjs }}
        run: |
          set -euo pipefail
          year='public, max-age=31536000, immutable'
          fresh='no-cache, no-store, must-revalidate'
          if [ "$NEXTJS" != true ]; then
            aws s3 sync "$DIST" "s3://$BUCKET" --delete --exclude '*.html' --cache-control "$year"
            aws s3 sync "$DIST" "s3://$BUCKET" --delete --exclude '*' --include '*.html' --cache-control "$fresh"
            exit 0
          fi

          # Only _next/static/ is content-hashed. Hashed files go up first so no page lands
          # before what it references, and nothing is deleted: a tab still on the previous
          # build fetches that build's chunks on client navigation. The prune below clears them.
          aws s3 sync "$DIST" "s3://$BUCKET" --exclude '*' --include '_next/static/*' --cache-control "$year"
          # cp, not sync: sync skips an unchanged file and would leave its old Cache-Control.
          aws s3 cp "$DIST" "s3://$BUCKET" --recursive --exclude '_next/static/*' --exclude '*.html' \
            --exclude '*.txt' --cache-control 'public, max-age=300, must-revalidate'
          # .txt files are the RSC payloads that client navigation fetches next to the HTML.
          aws s3 sync "$DIST" "s3://$BUCKET" --exclude '*' --include '*.html' --include '*.txt' \
            --cache-control "$fresh"

          cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix _next/static/ \
            --query "Contents[?LastModified<'$cutoff'].Key" --output text \
            | tr '\t' '\n' | { grep -v -e '^None$' -e '^$' || true; } | while read -r key; do
                aws s3 rm "s3://$BUCKET/$key"
              done

      - name: Invalidate CloudFront
        env:
          DOMAIN: ${{ inputs.domain }}
        run: |
          set -euo pipefail
          id=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, '$DOMAIN')].Id" --output text)
          [ -n "$id" ] || { echo "::error::no CloudFront distribution has alias $DOMAIN"; exit 1; }
          aws cloudfront create-invalidation --distribution-id "$id" --paths '/*' --query Invalidation.Id --output text
