# Build a static frontend and publish it to S3 behind CloudFront.
# Before `build-command` runs, the env holds every secret in Infisical folder /<app> plus each
# `ssm` entry, so the build (or a sed in front of it) can bake them in. HTML is uploaded
# no-cache. Other files are cached for a year, so they must be content-hashed; set
# `immutable-prefix` when only part of the output is (Next.js: `_next/static/`), and the rest
# gets an hour.
#
# Caller must grant: contents: read, id-token: write.
name: Deploy frontend

on:
  workflow_call:
    inputs:
      app:
        description: Infisical folder, e.g. `xomware`.
        required: true
        type: string
      role-key:
        description: Infisical secret holding the deploy role ARN.
        default: AWS_FRONTEND_ROLE_ARN
        type: string
      node-version:
        default: '20'
        type: string
      root:
        description: Directory holding package.json.
        default: .
        type: string
      install-command:
        default: npm ci
        type: string
      build-command:
        required: true
        type: string
      ssm:
        description: >-
          Terraform-computed values to export before the build, one `NAME=/ssm/path` per line.
          A missing or empty parameter fails the deploy.
        default: ''
        type: string
      dist-dir:
        description: Build output, relative to `root`.
        required: true
        type: string
      bucket:
        required: true
        type: string
      domain:
        description: A CloudFront alias of the distribution to invalidate.
        required: true
        type: string
      immutable-prefix:
        description: Only files under this prefix are content-hashed. Empty means all non-HTML files are.
        default: ''
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-frontend-${{ inputs.bucket }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Xomware/github-actions/actions/load-infisical-secrets@v1
        with:
          path: /${{ inputs.app }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env[inputs.role-key] }}
          aws-region: us-east-1

      # An `echo "X=$(aws ...)"` that swallowed a failed fetch once shipped empty credentials
      # to prod (xomify #296), so every value is checked.
      - name: Load SSM values
        if: inputs.ssm != ''
        env:
          SSM: ${{ inputs.ssm }}
        run: |
          set -euo pipefail
          while IFS='=' read -r name path; do
            [ -z "$name" ] && continue
            value=$(aws ssm get-parameter --name "$path" --with-decryption --query Parameter.Value --output text)
            if [ -z "$value" ] || [ "$value" = None ]; then
              echo "::error::SSM $path is empty"
              exit 1
            fi
            echo "$name=$value" >> "$GITHUB_ENV"
          done <<< "$SSM"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.root }}/package-lock.json

      - run: ${{ inputs.install-command }}
      - run: ${{ inputs.build-command }}

      - name: Upload
        env:
          DIST: ${{ inputs.dist-dir }}
          BUCKET: ${{ inputs.bucket }}
          IMMUTABLE: ${{ inputs.immutable-prefix }}
        run: |
          set -euo pipefail
          year='public, max-age=31536000, immutable'
          if [ -z "$IMMUTABLE" ]; then
            aws s3 sync "$DIST" "s3://$BUCKET" --delete --exclude '*.html' --cache-control "$year"
          else
            aws s3 sync "$DIST" "s3://$BUCKET" --delete --exclude '*' --include "$IMMUTABLE*" --cache-control "$year"
            aws s3 sync "$DIST" "s3://$BUCKET" --delete --exclude '*.html' --exclude "$IMMUTABLE*" \
              --cache-control 'public, max-age=3600'
          fi
          aws s3 sync "$DIST" "s3://$BUCKET" --delete --exclude '*' --include '*.html' \
            --cache-control 'no-cache, no-store, must-revalidate'

      - name: Invalidate CloudFront
        env:
          DOMAIN: ${{ inputs.domain }}
        run: |
          set -euo pipefail
          id=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, '$DOMAIN')].Id" --output text)
          [ -n "$id" ] || { echo "::error::no CloudFront distribution has alias $DOMAIN"; exit 1; }
          aws cloudfront create-invalidation --distribution-id "$id" --paths '/*' --query Invalidation.Id --output text
